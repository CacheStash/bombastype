<!DOCTYPE html>

  <head>
    <html lang="en">
  <style>
  /* ... CSS lama (scrollbar, text-stroke) biarkan saja ... */

  /* TAMBAHKAN INI UNTUK BACKGROUND KOTAK-KOTAK */
  .bg-grid-pattern {
    background-image: radial-gradient(circle, #e5e7eb 1px, transparent 1px);
    background-size: 20px 20px;
  }
</style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/FAVICON.png" />
    <title>BOMBASTYPE | Type Foundry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    
    <!-- Import Roboto Flex (Variable), Space Mono (Static), Inter (OTF), and Recursive (Variable + OTF) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Recursive:CASL,CRSV,MONO,slnt,wght@0..1,0..1,0..1,-15..0,300..1000&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Roboto+Flex:opsz,slnt,wdth,wght@8..144,-10..0,25..151,100..1000&display=swap" rel="stylesheet">
    <style>
      /* Custom scrollbar for brutalist feel */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #000;
        border-radius: 0;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #333;
      }
      
      /* Utility for text outline support since Tailwind doesn't have it built-in by default without plugins */
      .text-stroke-1 {
        -webkit-text-stroke: 1px black;
      }
      .text-stroke-2 {
        -webkit-text-stroke: 2px black;
      }
    </style>
  <script type="importmap">

}
</script>
